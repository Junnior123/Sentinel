name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: dotnet run --project desktop/Watchblock.Tests -p:RestoreConfigFile="$PWD/NuGet.Config" -- .
      - run: dotnet publish desktop/Watchblock.App -c Release -r win-x64 --self-contained true -p:RestoreConfigFile="$PWD/NuGet.Config" -o artifacts/sentinel-app
      - run: ./scripts/package.ps1
      - run: ./scripts/install-inno.ps1
      - run: ./scripts/build-installer.ps1
      - run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Sentinel-win-x64
          path: |
            artifacts/*.zip
            artifacts/*-Setup-x64.exe
            artifacts/*-Setup-x64.exe.sha256
