name: Deploy operator dashboard
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - name: Restore production configuration
        env:
          PRODUCTION_CONFIG: ${{ secrets.PRODUCTION_CONFIG }}
        run: node --input-type=module -e "import {writeFileSync} from 'node:fs'; if(!process.env.PRODUCTION_CONFIG)throw new Error('Set the production environment PRODUCTION_CONFIG secret to wrangler.production.json first'); writeFileSync('wrangler.production.json', process.env.PRODUCTION_CONFIG)"
      - run: pnpm check:production
      - run: pnpm build
      - run: pnpm test
      - run: pnpm db:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm exec wrangler deploy --config wrangler.production.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
